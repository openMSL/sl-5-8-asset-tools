site_name: sl-5-8-asset-tools
site_description: Tools to analyze, transform, and package simulation assets into EVES-003 conformant asset.zip archives
site_url: https://openmsl.github.io/sl-5-8-asset-tools/
repo_url: https://github.com/openMSL/sl-5-8-asset-tools
repo_name: openMSL/sl-5-8-asset-tools
edit_uri: edit/main/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list

nav:
  - Home: index.md
  - Getting Started:
      - Setup: getting-started/setup.md
      - Quick Start: getting-started/quickstart.md
  - Pipeline Modules:
      - Overview: modules/index.md
      - "📄 metadata_extractor": modules/metadata_extractor.md
      - "🔗 jsonld_creator": modules/jsonld_creator.md
      - "🔗 openlabel_creator": modules/openlabel_creator.md
      - "🧩 shacl_combiner": modules/shacl_combiner.md
      - "✨ metadata_enricher": modules/metadata_enricher.md
      - "✨ wizard": modules/wizard.md
      - "🔍 quality_checker": modules/quality_checker.md
      - "🗺️ geojson_creator": modules/geojson_creator.md
      - "🗺️ preview_3d": modules/preview_3d.md
      - "📇 search_indexer": modules/search_indexer.md
      - "📦 packager": modules/packager.md
      - "⚙️ pipeline": modules/pipeline.md
  - Utilities:
      - utils: utilities/utils.md
      - xodr_calc_box: utilities/xodr_calc_box.md
      - xodr_trim_to_box: utilities/xodr_trim_to_box.md
      - ontology_generator: utilities/ontology_generator.md
  - Reference:
      - Input Manifest: reference/input-manifest.md
      - Output Structure: reference/output-structure.md
      - Configuration: reference/configuration.md
      - Style Guide: reference/style-guide.md
  - Contributing: contributing.md
