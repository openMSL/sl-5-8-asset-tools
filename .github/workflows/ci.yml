name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate || . .venv/Scripts/activate
          pip install -e ".[dev]"
        shell: bash

      - name: Check
        run: make check

  smoke:
    name: Pipeline (${{ matrix.example }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        example: [opendrive, openscenario]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup
        run: make setup

      - name: Install QC dependencies
        run: .venv/bin/pip install -e ".[qc,qc-deps]"

      - name: Generate
        run: make generate ${{ matrix.example }}

      - name: Validate
        run: make validate
