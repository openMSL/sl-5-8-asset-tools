name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup
        run: make setup

      - name: Check
        run: make check

  smoke:
    name: Pipeline (${{ matrix.os }}, ${{ matrix.example }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        example: [opendrive, openscenario]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup
        run: make setup

      - name: Generate
        run: make generate ${{ matrix.example }}

      - name: Validate
        run: make validate

  smoke-geojson:
    name: Pipeline with GeoJSON (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup
        run: make setup

      - name: Generate with GeoJSON enabled
        run: make generate opendrive PIPELINE_FLAGS="-enable vcs_odr-converter"

      - name: Verify GeoJSON output exists
        run: |
          if find examples/assets -name "*.json" -path "*/3d_preview/*" | grep -q .; then
            echo "[OK] GeoJSON 3D preview files generated"
          else
            echo "[ERR] No GeoJSON 3D preview files found"
            exit 1
          fi
